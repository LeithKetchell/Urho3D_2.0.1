# Nightly build — Linux, Windows, macOS
# Produces one Urho3D library artifact per platform.

name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: build/lib/libUrho3D.a

          - name: Windows
            os: windows-latest
            artifact: build/lib/Urho3D.lib

          - name: macOS
            os: macos-13
            artifact: build/lib/libUrho3D.a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            glslang-tools

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install glslang

      - name: Configure
        run: >
          cmake -B build
          -DURHO3D_VULKAN=1
          -DURHO3D_GLSLANG=1
          -DURHO3D_DATABASE_SQLITE=1
          -DCMAKE_BUILD_TYPE=Release
          -DURHO3D_SAMPLES=0
          -DURHO3D_TOOLS=0

      - name: Build
        run: cmake --build build --target Urho3D --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Urho3D-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
